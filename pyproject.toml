[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "11mazon-cherrypicker-telegram-bot"
version = "0.1.0"
description = "11st Amazon Cherry Picker Telegram Bot"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=22.5",
    "selenium",
    "beautifulsoup4",
    "webdriver-manager",
    "python-dotenv"
]
authors = [
    {name = "ELSAPHABA"}
]

[tool.setuptools.packages.find]
where = ["."]